<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-0ZxDdlRWLE0snWOzNyQGBvzFX1j3aKuKK8buDOlluUk=' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self'; img-src data:; worker-src 'self'; connect-src https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f5fc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070911" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Remove passwords from PDF files in your browser, without quality loss. Text stays selectable and images aren't changed. Nothing is uploaded.">
  <title>PDF Password Remover | Quick Utility Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f43f5e'/%3E%3Cstop offset='1' stop-color='%23f97316'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M17.5 6 9.5 17.5h6L14.5 26l8-11.5h-6z' fill='%23ffffff'/%3E%3C/svg%3E">
  <script>
    document.documentElement.dataset.theme =
      localStorage.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-category="pdf">
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../../index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12z"/></svg>
        </span>
        <span>Quick Utility Tools</span>
      </a>
      <div class="header-right">
        <span class="header-badge"><span class="privacy-dot" aria-hidden="true"></span>No uploads</span>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="tool-main container">
    <div class="tool-head">
      <div class="tool-crumb">
        <a class="back-link" href="../../index.html"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>All tools</a>
        <span class="tool-category-pill">PDF tools</span>
      </div>
      <div class="tool-head-main">
        <span class="tool-title-icon icon-tone-crimson" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="14" height="10" rx="2"/><path d="M13 11V7a4 4 0 0 1 8 0v2"/></svg>
        </span>
        <div class="tool-title-copy">
          <h1>PDF Password Remover</h1>
          <p>Removes the password from a protected PDF. Text stays selectable and images aren't changed.</p>
        </div>
      </div>
    </div>

    <div class="panel">
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="application/pdf,.pdf" class="visually-hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M12 18v-6m-3 3 3-3 3 3"/></svg>
        <strong>Choose a PDF or drop it here</strong>
        <span>Your file stays on this device</span>
        <span class="dropzone-cta">Browse files</span>
        <span class="dropzone-formats">PDF</span>
      </label>

      <div class="file-row" id="fileRow" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
        <div class="file-meta">
          <div class="file-name" id="fileName"></div>
          <div class="file-size" id="fileSize"></div>
        </div>
        <button class="btn-danger-ghost" id="clearBtn" type="button">Remove</button>
      </div>

      <form class="password-block" id="passwordBlock" hidden>
        <label for="passwordInput">This PDF requires a password to open</label>
        <div class="password-row">
          <div class="password-wrap">
            <input class="input" type="password" id="passwordInput" autocomplete="off" placeholder="Enter password">
            <button class="pw-toggle" type="button" data-password-toggle aria-controls="passwordInput" aria-pressed="false" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
          <button class="btn btn-primary" id="unlockBtn" type="submit">Unlock</button>
        </div>
      </form>

      <div class="msg" id="msg" role="status" aria-live="polite" hidden></div>

      <div class="result" id="result" hidden>
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          Decrypted copy ready
        </h2>
        <div class="result-stats">
          <span>Original: <strong id="statBefore"></strong></span>
          <span>Decrypted: <strong id="statAfter"></strong></span>
        </div>
        <a class="btn btn-primary" id="downloadBtn" download>Download unlocked PDF</a>
        <button class="btn btn-secondary" id="anotherBtn" type="button">Choose another PDF</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© Quick Utility Tools · Files never leave your device</div>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
