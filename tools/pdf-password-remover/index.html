<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Remove passwords from PDF files right in your browser, without quality loss. Text stays selectable and images untouched. Nothing is uploaded.">
  <title>PDF Password Remover | Quick Utility Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M13 2 4.5 13.5H11L10 22l8.5-11.5H12z'/%3E%3C/svg%3E">
  <script>
    document.documentElement.dataset.theme =
      localStorage.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../../index.html">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12z"/></svg>
        Quick Utility Tools
      </a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="tool-main container">
    <div class="tool-head">
      <h1>PDF Password Remover</h1>
      <p>Removes the password from protected PDFs without touching the content: text stays selectable, images stay original.</p>
    </div>

    <div class="panel">
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="application/pdf,.pdf" class="visually-hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M12 18v-6m0 6-3-3m3 3 3-3"/></svg>
        <strong>Choose a PDF or drop it here</strong>
        <span>Your file stays on this device</span>
      </label>

      <div class="file-row" id="fileRow" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
        <div class="file-meta">
          <div class="file-name" id="fileName"></div>
          <div class="file-size" id="fileSize"></div>
        </div>
        <button class="link-btn" id="clearBtn" type="button">Remove</button>
      </div>

      <form class="password-block" id="passwordBlock">
        <label for="passwordInput">This PDF requires a password to open</label>
        <div class="password-row">
          <input type="password" id="passwordInput" autocomplete="off" placeholder="Enter password">
          <button class="btn btn-primary" id="unlockBtn" type="submit">Unlock</button>
        </div>
      </form>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <div class="result" id="result">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          Decrypted copy ready
        </h2>
        <div class="result-stats">
          <span>Original: <strong id="statBefore"></strong></span>
          <span>Decrypted: <strong id="statAfter"></strong></span>
        </div>
        <a class="btn btn-primary" id="downloadBtn" download>Download unlocked PDF</a>
        <button class="btn btn-secondary" id="anotherBtn" type="button">Process another file</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© Quick Utility Tools</div>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
